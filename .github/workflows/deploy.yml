name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Latest npm
        run: npm install -g npm@latest

      - name: Install dependencies and build
        run: |
          npm install
          npm run build
        working-directory: client

      - name: Write SSH Key to File
        run: |
          echo "${{ secrets.SERVER_SSH_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

      - name: Deploy to Server using SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # Ensure the target directory exists on the server
            mkdir -p /var/www/doqa-io
            # Use the temporary key file in rsync
            RSYNC_RSH="ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no" \
            rsync -avz --delete client/build/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/doqa-io/
            # Restart Nginx if needed
            sudo systemctl restart nginx
