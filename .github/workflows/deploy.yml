name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Checkout code
    - name: Checkout repository
      uses: actions/checkout@v3

    # Set up Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    # Install dependencies
    - name: Install dependencies
      working-directory: ./server
      run: npm install

    # Set up PostgreSQL for tests
    - name: Set up PostgreSQL
      uses: harmon758/postgresql-action@v1.0.0
      with:
        postgresql version: '15'
        postgresql db: ${{ secrets.DB_NAME }}
        postgresql user: ${{ secrets.DB_USER }}
        postgresql password: ${{ secrets.DB_PASSWORD }}

    # Run Tests
    - name: Run tests
      working-directory: ./server
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        NODE_ENV: test
      run: npm test

    # Deploy backend using SCP
    - name: Deploy backend using SCP
      uses: appleboy/scp-action@v0.1.6
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: 22
        source: "server/*"
        target: "/var/www/doqa-io/server"

    # Deploy frontend using SCP
    - name: Deploy frontend using SCP
      uses: appleboy/scp-action@v0.1.6
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: 22
        source: "client/build/*"
        target: "/var/www/doqa-io/client/build"

    # Restart the application
    - name: Restart server
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: 22
        script: |
          pm2 restart all
