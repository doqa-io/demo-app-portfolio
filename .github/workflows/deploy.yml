name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      - name: Install dependencies (back-end)
        working-directory: ./server
        run: npm install

      - name: Run tests (back-end)
        working-directory: ./server
        run: npm test

      - name: Install dependencies (front-end)
        working-directory: ./client
        run: npm install

      - name: Run tests (front-end)
        working-directory: ./client
        run: npm test

      - name: Build front-end
        working-directory: ./client
        run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to IONOS Deploy Now
        env:
          IONOS_TOKEN: ${{ secrets.IONOS_TOKEN }}
        run: |
          curl -X POST "https://api.ionos.com/v1/deployments" \
          -H "Authorization: Bearer $IONOS_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"source": {"type": "GIT", "repo": "https://github.com/doqa-io/demo-app-portfolio"}}'
