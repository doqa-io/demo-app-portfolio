name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: Install dependencies and build
        run: |
          npm install
          npm run build
        working-directory: client

      - name: Deploy to Server using SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # Disable strict host key checking
            export RSYNC_RSH="ssh -o StrictHostKeyChecking=no"
            # Ensure the target directory exists on the server
            mkdir -p /var/www/doqa-io
            # Copy files from GitHub Actions runner to the server
            rsync -avz --delete client/build/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/doqa-io/
            # Restart Nginx if needed
            sudo systemctl restart nginx
      
