name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Install server dependencies
      - name: Install server dependencies
        working-directory: ./server
        run: npm install

      # Wait for PostgreSQL to be ready
      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432; do
            echo "Waiting for PostgreSQL to be ready..."
            sleep 1
          done

      # Create test database schema
      - name: Set up database schema
        working-directory: ./server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node dbSetup.js

      # Run backend tests
      - name: Run backend tests
        working-directory: ./server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: test
        run: npm test

      # Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: ./client
        run: npm ci

      # Run frontend tests
      - name: Run frontend tests
        working-directory: ./client
        run: npm test

      # Deploy backend using SCP
      - name: Deploy backend using SCP
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "server/*"
          target: "/var/www/doqa-io/"

      # Build the frontend
      - name: Build frontend
        working-directory: ./client
        run: npm run build

      # Deploy frontend using SCP
      - name: Deploy frontend using SCP
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "client/build/*"
          target: "/var/www/doqa-io/client/build"

      # Restart the application
      - name: Restart server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            pm2 restart all

      # Run Cypress tests on live site
      - name: Run Cypress tests on live front
        uses: cypress-io/github-action@v5
        with:
          config-file: cypress.json
        env:
          CYPRESS_BASE_URL: https://doqa.io
          CYPRESS_API_URL: https://doqa.io/api
