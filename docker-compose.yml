version: '3'
services:
  backend:
    build:
      context: ./server
    ports:
      - "4000:4000"
    env_file:
      - server/.env
    depends_on:
      - mongo
    networks:
      - app-network

  frontend:
    build:
      context: ./client
    ports:
      - "3000:3000"
    networks:
      - app-network

  mongo:
    image: mongo
    restart: always
    ports:
      - "27017:27017"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
